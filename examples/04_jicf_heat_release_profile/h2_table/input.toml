# Starting-point flamelet table input for the Micka & Driscoll Case 2 hydrogen JICF example.
# Adjust as needed once the validation workflow is established.

[mechanism]
file = "../../../data/mechanisms/h2_boivin_9sp_12r_mod.yaml"
transport_model = "multicomponent"
prog_def = { H2O = 1.0 }

[conditions]
pressure = 101325.0
initial_chi_st = 1.0e1

[fuel_inlet]
composition = { H2 = 1.0 }
temperature = 247.0

[oxidizer_inlet]
composition = { O2 = 0.21, N2 = 0.79 }
temperature = 1413.0

[solver]
output_dir = "flamelet_results"
create_plots = true
width_ratio = 10.0
width_change_enable = false
width_change_max = 0.1
width_change_min = 0.05
n_max = 5000
initial_spacing = 0.6
delta_T = 20.0
max_delta_T = 100.0
target_delta_T_max = 20.0
max_error_count = 3
strain_rate_tol = 0.01
n_extinction_points = 10
write_FlameMaster = true
loglevel = 0

[tabulation]
dims = [200, 2, 200]
force_monotonicity = false
igniting_table = true
include_species_mass_fractions = "all"
include_species_production_rates = "all"
include_energy_enthalpy_components = true

[plotting.s_curve]
x_quantity = "chi_st"
y_quantity = "T_max"

[plotting.profiles]
colormap = "viridis"

[plotting.table]
vars = ["T0", "SRC_PROG", "OH", "PROG", "TA", "AMU", "ALOC", "AGAMMA"]
colormap = "viridis"
