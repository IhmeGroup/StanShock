# Table-generation scaffold for the oxygen-nitrogen autoignition case.
# This is intended as a user-facing starting point for the FPV branch of
# 04_autoignition_vitiated_flow.
#
# Adjust the conditions below to exactly match the final paper-reference case
# once the digitized comparison dataset is locked down.

[mechanism]
file = "../../../data/mechanisms/h2_boivin_9sp_12r_mod.yaml"
transport_model = "multicomponent"
prog_def = { H2O = 1.0 }

[conditions]
pressure = 101325.0
initial_chi_st = 1.0e-3

[fuel_inlet]
composition = { H2 = 1.0 }
temperature = 300.0

[oxidizer_inlet]
composition = { O2 = 0.233, N2 = 0.767 }
temperature = 1400.0

[solver]
output_dir = "flamelet_results"
create_plots = true
width_ratio = 10.0
width_change_enable = false
width_change_max = 0.1
width_change_min = 0.05
n_max = 5000
initial_spacing = 0.6
delta_T = 20.0
max_delta_T = 100.0
target_delta_T_max = 20.0
max_error_count = 3
strain_rate_tol = 0.01
n_extinction_points = 10
write_FlameMaster = true
loglevel = 0

[tabulation]
dims = [200, 2, 200]
force_monotonicity = false
igniting_table = true
include_species_mass_fractions = "all"
include_species_production_rates = "all"
include_energy_enthalpy_components = true

[plotting.s_curve]
x_quantity = "chi_st"
y_quantity = "T_max"

[plotting.profiles]
colormap = "viridis"

[plotting.table]
vars = ["T0", "SRC_PROG", "OH", "PROG", "TA", "AMU", "ALOC", "AGAMMA"]
colormap = "viridis"
